<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        :root {
            --pink: #ffc0cb;
            --dark-pink: #d02090;
            --hot-pink: #ff69b4;
        }

        body {
            background-color: var(--pink);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: var(--dark-pink);
            font-size: clamp(2rem, 8vw, 3.5rem);
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            min-height: 200px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #yesBtn {
            background-color: var(--hot-pink);
            color: white;
            z-index: 100;
        }

        #yesBtn:hover {
            transform: scale(4);
        }

        #noBtn {
            background-color: white;
            color: var(--dark-pink);
            z-index: 1000; 
        }

        .heart {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            opacity: 0.7;
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(20deg); }
        }

        /* Success screen styling */
        .success-gif {
            width: 300px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="main-content" class="container">
        <h1>Tessa, will you be my valentine?</h1>
        <div class="btn-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainContent = document.getElementById('main-content');

        // 1. Heart Generation
        const createHearts = (count) => {
            const hearts = ['❤️', '💖', '💝', '💕', '💗'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'heart';
                el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = Math.random() * 100 + 'vh';
                el.style.fontSize = (Math.random() * 2 + 1) + 'rem';
                el.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(el);
            }
        };

        // 2. Button Movement
        const moveNoButton = () => {
            noBtn.style.position = 'fixed';
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        };

        noBtn.addEventListener('mouseover', moveNoButton);

        // 3. Success Logic with GIF
        yesBtn.addEventListener('click', () => {
            // Replace this URL with any GIF you like!
            const gifUrl = "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExc3ZkNTl3YWExc2cwbjgyYjQ1eTV6MGdlYnc1ZW9oY29jbzIyc3VteSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/nbQ4jhfx9YKYbOTL6s/giphy.gif";
            
            mainContent.innerHTML = `
                <h1 style="font-size: 4rem; color: #d02090;">❤️ Yay! ❤️</h1>
                <img src="${gifUrl}" alt="Happy Cat" class="success-gif">
                <p style="font-size: 1.8rem; color: #ff69b4; margin-top: 20px;">I knew you'd say yes, Tessa!</p>
            `;
            
            createHearts(40); // Add an explosion of hearts
        });

        createHearts(30);
    </script>
</body>
</html>
