<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        :root {
            --pink: #ffc0cb;
            --dark-pink: #d02090;
            --hot-pink: #ff69b4;
        }

        body {
            background-color: var(--pink);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: var(--dark-pink);
            font-size: clamp(2rem, 8vw, 3.5rem);
            margin-bottom: 2rem;
            pointer-events: none; /* Allows hearts to be seen behind text */
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            min-height: 200px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #yesBtn {
            background-color: var(--hot-pink);
            color: white;
            z-index: 100;
        }

        #yesBtn:hover {
            transform: scale(4); /* Made it even bigger */
        }

        #noBtn {
            background-color: white;
            color: var(--dark-pink);
            /* Position fixed ensures it stays relative to the screen, not the container */
            z-index: 1000; 
        }

        .heart {
            position: absolute;
            pointer-events: none;
            z-index: 5; /* Hearts now float over text and buttons per your request */
            opacity: 0.7;
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(20deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tessa, will you be my valentine?</h1>
        <div class="btn-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // 1. Improved Heart Generation (Now covers the whole screen)
        const createHearts = (count) => {
            const hearts = ['❤️', '💖', '💝', '💕', '💗'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'heart';
                el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = Math.random() * 100 + 'vh';
                el.style.fontSize = (Math.random() * 2 + 1) + 'rem';
                el.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(el);
            }
        };

        // 2. Solidified Movement Logic
        const moveNoButton = () => {
            // Use fixed to ensure it's always visible relative to the viewport
            noBtn.style.position = 'fixed';
            
            const padding = 50; // Extra padding to keep it away from the very edges
            
            // Calculate available space in the viewport
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // Generate new coordinates
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        };

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        yesBtn.addEventListener('click', () => {
            document.body.innerHTML = `
                <div style="text-align:center; width:100%;">
                    <h1 style="font-size: 5rem; color: #d02090;">❤️ Success! ❤️</h1>
                    <p style="font-size: 2rem; color: #ff69b4;">I knew you couldn't say no!</p>
                </div>
            `;
            createHearts(50); // Explode with more hearts
        });

        createHearts(30);
    </script>
</body>
</html>
